<!DOCTYPE html>
<!--
=====================================================================
  RIY@ KLOSET: ONLINE SHOP (storefront)
  Static page + Supabase (database, photo storage, admin logins).
=====================================================================

  HOW IT WORKS
  ------------
  • Products and shop details (WhatsApp, hours, delivery fees, MoMo number)
    come from Supabase. The owner edits them at /admin.html from her phone.
  • If config.js isn't filled in yet, the page runs in DEMO MODE with the
    sample stock below, so you can still preview the design.
  • Orders go to the owner on WhatsApp as a pre-filled message.
    Mobile Money is paid manually AFTER she confirms the items on WhatsApp
    (no payment gateway yet; see README "Next steps").
  • The last loaded stock is cached in the browser so repeat visits open fast
    on mobile data, then refresh in the background.

  QUICK EDITS
  -----------
  • Default shop details (used until she saves her own in admin): "SECTION: CONFIG"
  • Sample/demo products:                          "SECTION: PRODUCTS"
  • Colours & fonts:                               "SECTION: THEME"
  • Home page text (tagline etc.):                 "SECTION: HOME VIEW"
  • About / story text:                            "SECTION: ABOUT VIEW"
=====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Riy@ Kloset | Fashion, Bags, Shoes & Phones in Accra</title>
<meta name="description" content="Riy@ Kloset: where style meets affordability. New fashion, bags, shoes and phones in Accra. Order on WhatsApp, delivery in Accra and nationwide.">

<style>
/* ===================================================================
   SECTION: THEME (colours, fonts, spacing). Change these first.
   =================================================================== */
:root{
  /* Lemon green + white + black palette (chosen by the client).
     Variable names kept from v1 so nothing breaks:
     --green = main dark colour (black), --gold = lemon accent */
  --green:#111111;      /* black: active states, chips, links */
  --green-d:#0B0B0B;    /* black: header, footer, dark panels */
  --gold:#C6F432;       /* LEMON GREEN: buttons, the "@", highlights */
  --lemon-d:#3F6B00;    /* deep lemon-green for small text on white (readable) */
  --red:#E03C31;        /* red (urgency: "Only 1 left") */
  --cream:#F7F7F5;      /* near-white page background (white cards stand out) */
  --ink:#111111;        /* main text */
  --muted:#666666;      /* secondary text */
  --line:#E5E5E0;       /* borders */
  --blush:#F4FBDF;      /* soft lemon fills */
  --lav:#E6E6E3;        /* light grey accent */
  --card:#FFFFFF;
  --radius:16px;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif; /* system fonts = zero download */
}

/* ---------- Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--cream);color:var(--ink);line-height:1.45;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--green-d);color:#fff}
.top-in{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
.logo{font-weight:900;font-size:1.55rem;letter-spacing:-.035em;line-height:1;display:flex;align-items:center;white-space:nowrap}
.logo .at{display:inline-grid;place-items:center;width:1.02em;height:1.02em;border-radius:50%;background:var(--gold);color:var(--green-d);font-size:.86em;font-weight:900;margin:0 .07em 0 .03em;transform:rotate(-14deg);box-shadow:2px 2px 0 var(--green)}
.logo .k{font-weight:500;margin-left:.22em;letter-spacing:-.01em}
.nav{display:none;gap:4px}
.nav a{padding:10px 16px;border-radius:999px;font-weight:700;font-size:.95rem;opacity:.9}
.nav a.on,.nav a:hover{background:rgba(255,255,255,.12);opacity:1}
.cart-btn{position:relative;width:48px;height:48px;display:grid;place-items:center;border-radius:14px;background:rgba(255,255,255,.1)}
.cart-btn svg{width:24px;height:24px}
.count{position:absolute;top:4px;right:3px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--ink);font-size:.72rem;font-weight:900;display:grid;place-items:center}
.count[data-n="0"]{display:none}
.kente{height:7px;background:repeating-linear-gradient(90deg,var(--gold) 0 22px,#FFFFFF 22px 30px,var(--green) 30px 52px,var(--lav) 52px 58px,var(--gold) 58px 62px,#FFFFFF 62px 66px)}
@media(min-width:900px){.nav{display:flex}}

/* ---------- Bottom nav (mobile) ---------- */
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:45;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 20px rgba(0,0,0,.05)}
.bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;font-size:.72rem;font-weight:700;color:var(--muted);position:relative}
.bnav a.on{color:var(--green)}
.bnav a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.bnav svg{width:24px;height:24px}
.bnav .count{top:6px;right:calc(50% - 22px)}
@media(min-width:900px){.bnav{display:none}body{padding-bottom:0}}

/* ---------- Floating WhatsApp button ---------- */
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:44;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab svg{width:32px;height:32px}
.fab::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid #25D366;opacity:.5;animation:ring 2.4s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.25);opacity:0}}
@media(min-width:900px){.fab{bottom:24px;right:24px}}
@media(prefers-reduced-motion:reduce){.fab::after{animation:none}*{scroll-behavior:auto!important}}

/* ---------- Buttons, chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:14px;font-weight:800;font-size:1rem;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-green{background:var(--green);color:#fff}
.btn-wa{background:#25D366;color:#04361b}
.btn-ghost{border:2px solid rgba(255,255,255,.55);color:#fff}
.btn-line{border:2px solid var(--line);background:#fff;color:var(--ink)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.9rem;white-space:nowrap;display:inline-flex;align-items:center}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}

/* ---------- Hero ---------- */
.hero{background:linear-gradient(135deg,#1A1A1A 0%,#111111 55%,#141414 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(198,244,50,.28),transparent 65%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:inherit}
.hero-in{position:relative;padding:30px 16px 34px;display:grid;gap:26px;max-width:1180px;margin:0 auto}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.13);padding:7px 13px;border-radius:999px;font-size:.8rem;font-weight:800;width:max-content}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--gold);display:block}
.hero h1{font-size:clamp(2.1rem,9vw,3.8rem);line-height:1;font-weight:900;letter-spacing:-.035em;margin:14px 0 12px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{font-size:1.05rem;opacity:.92;max-width:34ch}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hero-cta .btn{flex:1 1 160px}
.collage{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:end}
.collage .tile{border-radius:16px;overflow:hidden;position:relative;aspect-ratio:3/4;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.collage .tile:nth-child(1){transform:rotate(-4deg)}
.collage .tile:nth-child(2){transform:translateY(-14px);aspect-ratio:3/4.4}
.collage .tile:nth-child(3){transform:rotate(4deg)}
.collage .tag{position:absolute;left:8px;bottom:8px;background:#fff;color:var(--ink);font-weight:900;font-size:.8rem;padding:4px 9px;border-radius:999px}
@media(min-width:900px){.hero-in{grid-template-columns:1.1fr 1fr;align-items:center;padding:56px 16px 64px}.hero p{font-size:1.15rem}.hero-cta .btn{flex:0 0 auto}}

/* ---------- Trust strip ---------- */
.trust{background:#fff;border-bottom:1px solid var(--line)}
.trust-in{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px 16px}
.trust-item{display:flex;align-items:center;gap:10px;font-size:.84rem;font-weight:700;line-height:1.2}
.trust-item span{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--blush);color:var(--green)}
.trust-item svg{width:20px;height:20px}
.trust-item small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
@media(min-width:900px){.trust-in{grid-template-columns:repeat(4,1fr);padding:18px 16px}}

/* ---------- Sections ---------- */
.sec{padding:30px 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:1.45rem;font-weight:900;letter-spacing:-.025em;line-height:1.1}
.sec-h p{color:var(--muted);font-size:.88rem;margin-top:3px}
.sec-h a{font-weight:800;color:var(--green);font-size:.9rem;white-space:nowrap;padding:10px 0}
h1.page{font-size:1.75rem;font-weight:900;letter-spacing:-.03em;line-height:1.1}

/* ---------- Category tiles ---------- */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{border-radius:var(--radius);padding:16px;min-height:120px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;font-weight:900;font-size:1.15rem}
.cat svg{position:absolute;right:-8px;bottom:-10px;width:96px;height:96px;opacity:.9;color:#2B2B2B}
.cat.wide svg{color:var(--green)}
.cat small{display:block;font-size:.78rem;font-weight:600;opacity:.75}
.cat .arrow{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-size:1rem}
.cat.wide{grid-column:span 2;background:var(--green-d)!important;color:#fff}
.cat.wide .arrow{background:var(--gold);color:var(--ink)}
@media(min-width:900px){.cats{grid-template-columns:repeat(5,1fr)}.cat.wide{grid-column:auto}.cat{min-height:170px}}

/* ---------- Product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,1fr);gap:16px}}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:46%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
@media(min-width:640px){.row{grid-auto-columns:31%}}
@media(min-width:1040px){.row{grid-auto-columns:23.5%}}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;scroll-snap-align:start}
.card-img{position:relative;aspect-ratio:4/5;display:block;overflow:hidden}
.card-img img,.ph{width:100%;height:100%;object-fit:cover}
.ph{display:grid;place-items:center;position:relative}
.ph svg{width:44%;height:44%}
.ph .ph-tag{position:absolute;bottom:8px;right:10px;font-size:.6rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.badge{font-size:.68rem;font-weight:900;padding:4px 9px;border-radius:999px;background:var(--ink);color:#fff;letter-spacing:.01em}
.badge.red{background:var(--red)}
.badge.gold{background:var(--gold);color:var(--ink)}
.badge.green{background:var(--green)}
.card-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.card-name{font-weight:700;font-size:.93rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{font-size:.78rem;color:var(--muted)}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:6px}
.price{font-weight:900;font-size:1.15rem;letter-spacing:-.02em;line-height:1.1}
.price s{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.add{width:46px;height:46px;flex:none;border-radius:13px;background:var(--green);color:#fff;display:grid;place-items:center}
.add svg{width:22px;height:22px}
.add.in{background:var(--gold);color:var(--ink)}

/* Condition pills */
.cond{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:800;padding:3px 8px;border-radius:6px;width:max-content;background:var(--blush);color:#3F6B00}
.cond::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cond[data-c="Very Good"]{background:#EDEDEA;color:#2B2B2B}
.cond[data-c="Good"]{background:#F1F9D6;color:#555555}
.cond[data-c="UK Used"]{background:#E6E6E3;color:#333333}
.cond[data-c="Refurbished"]{background:#F1F9D6;color:#4F7D00}

/* ---------- Steps / how it works ---------- */
.steps{display:grid;gap:12px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:flex-start}
.step b{width:40px;height:40px;flex:none;border-radius:12px;background:var(--gold);display:grid;place-items:center;font-weight:900;font-size:1.1rem}
.step h3{font-size:1rem;font-weight:800}
.step p{font-size:.88rem;color:var(--muted)}
@media(min-width:900px){.steps{grid-template-columns:repeat(3,1fr)}}
.band{background:var(--green-d);color:#fff;border-radius:20px;padding:22px;display:grid;gap:14px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,var(--gold) 0 18px,#FFFFFF 18px 26px,var(--green) 26px 44px)}
.band h2{font-size:1.35rem;font-weight:900;letter-spacing:-.02em}
.band p{opacity:.8;font-size:.92rem}

/* ---------- Shop view ---------- */
.shop-head{padding:20px 0 6px}
.search{position:relative;margin:14px 0 12px}
.search input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:0 16px 0 46px;font-size:1rem}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;margin:12px 0}
.toolbar .fbtn{min-height:46px;padding:0 16px;border-radius:12px;border:1.5px solid var(--ink);font-weight:800;display:inline-flex;align-items:center;gap:8px;background:#fff}
.toolbar .fbtn svg{width:18px;height:18px}
.toolbar .fbtn em{font-style:normal;background:var(--gold);border-radius:999px;padding:0 7px;font-size:.78rem}
.toolbar select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-weight:700;margin-left:auto;max-width:52%}
.rcount{font-size:.85rem;color:var(--muted);margin-bottom:10px}
.shop-layout{display:block}
.fpanel{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:22px 22px 0 0;max-height:86vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease}
.fpanel.open{transform:none}
.fpanel-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.fpanel-h h3{font-weight:900;font-size:1.15rem}
.fpanel-b{padding:6px 18px 18px;overflow-y:auto}
.fpanel-f{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.fgroup{padding:14px 0;border-bottom:1px dashed var(--line)}
.fgroup:last-child{border:0}
.fgroup h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:10px}
.fgroup select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;padding:0 12px;font-weight:700}
.close-x{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--cream);font-size:1.3rem}
.overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:var(--radius);padding:30px 18px;text-align:center;grid-column:1/-1}
.empty h3{font-weight:900;margin-bottom:6px}
.empty p{color:var(--muted);font-size:.9rem;margin-bottom:14px}
@media(min-width:900px){
  .shop-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
  .fpanel{position:sticky;top:84px;transform:none;border-radius:var(--radius);border:1px solid var(--line);max-height:calc(100vh - 100px);z-index:1}
  .fpanel .close-x,.fpanel-f .btn-green,.toolbar .fbtn,.overlay{display:none}
  .fpanel-f{padding:12px 18px}
}

/* ---------- Product detail ---------- */
.crumb{font-size:.82rem;color:var(--muted);padding:14px 0}
.crumb a{color:var(--green);font-weight:700}
.pd{display:grid;gap:20px;padding-bottom:30px}
.gallery-main{border-radius:20px;overflow:hidden;aspect-ratio:1/1;position:relative;border:1px solid var(--line)}
.gallery-main img,.gallery-main .ph{width:100%;height:100%;object-fit:cover}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.thumbs button{border-radius:12px;overflow:hidden;aspect-ratio:1/1;border:2px solid transparent;padding:0}
.thumbs button.on{border-color:var(--green)}
.thumbs .ph svg{width:50%;height:50%}
.thumbs .ph .ph-tag{display:none}
.pd h1{font-size:1.6rem;font-weight:900;letter-spacing:-.03em;line-height:1.12;margin:8px 0 6px}
.pd .big-price{font-size:2rem;font-weight:900;letter-spacing:-.03em;color:var(--green-d)}
.pd .big-price s{font-size:1rem;color:var(--muted);font-weight:500;margin-left:8px}
.pd .save{display:inline-block;background:var(--gold);font-weight:900;font-size:.78rem;padding:3px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.stock{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.9rem;margin:12px 0}
.stock i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(210,35,42,.15)}
.stock.ok i{background:#2E9E5B;box-shadow:0 0 0 4px rgba(120,170,10,.15)}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:12px 0}
.box h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.box p{font-size:.95rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{font-weight:800;text-align:right}
.battery{display:flex;align-items:center;gap:10px;justify-content:flex-end}
.battery .bar{width:70px;height:14px;border-radius:4px;border:2px solid var(--ink);padding:1px;position:relative}
.battery .bar::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:4px;background:var(--ink);border-radius:0 2px 2px 0}
.battery .bar span{display:block;height:100%;border-radius:2px;background:#2E9E5B}
.warranty{background:var(--blush);border:1px solid #DDF29A;border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;margin:12px 0}
.warranty svg{width:26px;height:26px;flex:none;color:var(--green)}
.warranty b{display:block;margin-bottom:2px}
.warranty p{font-size:.9rem}
.actions{display:grid;gap:10px;margin:16px 0}
.mini-trust{display:grid;gap:8px;font-size:.88rem;margin-top:6px}
.mini-trust div{display:flex;gap:10px;align-items:center}
.mini-trust svg{width:18px;height:18px;color:var(--green);flex:none}
@media(min-width:900px){.pd{grid-template-columns:1.05fr 1fr;gap:40px}.pd h1{font-size:2.1rem}}

/* ---------- Cart ---------- */
.cart-layout{display:grid;gap:18px;padding:20px 0 34px}
.citem{display:grid;grid-template-columns:84px 1fr auto;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;align-items:center}
.citem .thumb{width:84px;height:100px;border-radius:12px;overflow:hidden}
.citem .thumb svg{width:50%;height:50%}

/* Returns a real <img> if the product has a photo for that slot, otherwise a coloured placeholder */
function pic(p, slot = 0) {
  if (p.images && p.images[slot]) return `<img src="${p.images[slot]}" alt="${p.name}" loading="lazy" decoding="async">`;
  const [bg, fg] = TONES[(p.tone + slot) % TONES.length];
  return `<div class="ph" style="background:${bg};color:${fg}">${ICON[p.cat]}<span class="ph-tag">${VIEW_LABELS[slot]}</span></div>`;
}

/* ---------- Safety: everything typed in admin is escaped before it's shown ---------- */
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const plain = s => { const t = document.createElement("textarea"); t.innerHTML = s; return t.value; }; // undo esc for WhatsApp text

/* =====================================================================
   SECTION: DATA (Supabase)
   ===================================================================== */
let DEMO = false, LOAD_ERROR = false, sb = null;
function hasBackend() {
  const c = window.RK_CONFIG || {};
  return !!(c.supabaseUrl && c.supabaseAnonKey && !/YOUR/.test(c.supabaseUrl + c.supabaseAnonKey) && window.supabase);
}
function toneFrom(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 6; }

/* Database row → the product shape the page uses */
function fromRow(r) {
  const sizes = (r.sizes || []).filter(Boolean).map(esc);
  return {
    id: r.id, cat: r.category, name: esc(r.name), price: Number(r.price),
    old: r.old_price && Number(r.old_price) > Number(r.price) ? Number(r.old_price) : null,
    size: sizes.length === 1 ? sizes[0] : undefined, sizes: sizes.length > 1 ? sizes : undefined,
    condition: r.condition, stock: r.stock ?? 1, fresh: !!r.fresh,
    added: Math.max(0, Math.floor((Date.now() - new Date(r.created_at)) / 864e5)),
    tone: toneFrom(r.id), measure: esc(r.measurements), desc: esc(r.description),
    images: (r.images || []).filter(u => /^(https:\/\/|data:image\/)/.test(u)).map(esc),
    brand: esc(r.brand), storage: esc(r.storage), ram: esc(r.ram), colour: esc(r.colour),
    battery: r.battery ?? 100, box: esc(r.in_box)
  };
}
/* Settings saved in admin → CONFIG (escaped) */
function cleanSettings(d) {
  const out = {};
  for (const [k, v] of Object.entries(d || {})) {
    if (typeof v === "string") out[k] = esc(v);
    else if (k === "hours" && Array.isArray(v)) out.hours = v.map(([a, b]) => [esc(a), esc(b)]);
    else if (k === "delivery" && Array.isArray(v)) out.delivery = v.map(o => ({ id: esc(o.id), label: esc(o.label), note: esc(o.note), fee: Number(o.fee) || 0 }));
  }
  if (out.whatsapp) out.whatsapp = plain(out.whatsapp).replace(/\D/g, "");
  if (out.instagram && !/^https:\/\//.test(out.instagram)) delete out.instagram;
  if (out.tiktok && !/^https:\/\//.test(out.tiktok)) delete out.tiktok;
  return out;
}
async function loadData() {
  if (!hasBackend()) { DEMO = true; PRODUCTS = SAMPLE_PRODUCTS; return; }
  const c = window.RK_CONFIG;
  sb = sb || window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey);
  try {
    const [prods, set] = await Promise.all([
      sb.from("products").select("*").eq("status", "active").order("created_at", { ascending: false }),
      sb.from("settings").select("data").eq("id", 1).maybeSingle()
    ]);
    if (prods.error) throw prods.error;
    PRODUCTS = prods.data.map(fromRow);
    if (set.data && set.data.data) CONFIG = { ...CONFIG, ...cleanSettings(set.data.data) };
    LOAD_ERROR = false;
    store.set("rk_cache", { p: prods.data, s: set.data ? set.data.data : null });
  } catch (err) {
    console.error("Could not load shop data", err);
    LOAD_ERROR = !PRODUCTS.length;
  }
}

/* Shop phone numbers (both shown as tap-to-call links) */
function phoneList() { return [CONFIG.phone, CONFIG.phone2].filter(Boolean); }
function phoneLinks(color, sep) {
  return phoneList().map(n => `<a href="tel:${plain(n).replace(/[^\d+]/g, "")}" style="color:${color}">${n}</a>`).join(sep);
}

function waLink(text) { return `https://wa.me/${CONFIG.whatsapp}` + (text ? `?text=${encodeURIComponent(text)}` : ""); }

function toast(msg, linkHtml = "") {
  const t = $("#toast");
  t.innerHTML = `<span>${msg}</span>${linkHtml}`;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- Badges & cards ---------- */
function badges(p) {
  let b = "";
  if (p.stock === 1) b += `<span class="badge red">Only 1 left</span>`;
  else if (p.stock <= 3) b += `<span class="badge red">Only ${p.stock} left</span>`;
  if (p.old) b += `<span class="badge gold">-${Math.round((1 - p.price / p.old) * 100)}%</span>`;
  if (p.fresh) b += `<span class="badge green">New in</span>`;
  return `<div class="badges">${b}</div>`;
}
function inCart(id) { return state.cart.some(i => i.id === id); }

function card(p) {
  const meta = p.cat === "phones"
    ? `${p.storage} · ${p.ram} RAM · ${p.colour}`
    : (p.sizes ? `Sizes ${p.sizes.join(", ")}` : `Size ${p.size}`);
  const btn = p.sizes && p.sizes.length > 1
    ? `<a class="add" href="#/p/${p.id}" aria-label="Choose size for ${p.name}">${ICON.plus}</a>`
    : `<button class="add ${inCart(p.id) ? "in" : ""}" data-add="${p.id}" aria-label="Add ${p.name} to cart">${inCart(p.id) ? ICON.check : ICON.plus}</button>`;
  return `<article class="card">
    <a class="card-img" href="#/p/${p.id}">${pic(p)}${badges(p)}</a>
    <div class="card-body">
      <a class="card-name" href="#/p/${p.id}">${p.name}</a>
      <div class="card-meta">${meta}</div>
      <div class="card-foot">
        <div class="price">${cedi(p.price)}${p.old ? `<s>${cedi(p.old)}</s>` : ""}</div>
        ${btn}
      </div>
    </div>
  </article>`;
}

const PRICE_RANGES = {
  fashion: [["0-100","Under GH₵100"],["100-200","GH₵100–200"],["200-400","GH₵200–400"],["400-","GH₵400+"]],
  phones:  [["0-2500","Under GH₵2,500"],["2500-4000","GH₵2,500–4,000"],["4000-6000","GH₵4,000–6,000"],["6000-","GH₵6,000+"]]
};

function viewShop(mode, cat, sortParam) {
  // Reset filters when switching between fashion & phones; reset size when category changes
  if (state.mode !== mode) state.f = freshFilters();
  else if (state.cat !== cat) state.f.size = "";
  if (sortParam) state.f.sort = sortParam;
  state.mode = mode; state.cat = cat;

  state.base = mode === "phones"
    ? PRODUCTS.filter(p => p.cat === "phones")
    : PRODUCTS.filter(p => p.cat !== "phones" && (cat === "all" || p.cat === cat));

  const f = state.f;
  const chip = (key, val, label, on) => `<button class="chip ${on ? "on" : ""}" data-f="${key}" data-v="${val}">${label}</button>`;
  const priceChips = PRICE_RANGES[mode].map(([v, l]) => chip("price", v, l, f.price === v)).join("");

  let groups;
  if (mode === "phones") {
    const brands = [...new Set(state.base.map(p => p.brand))];
    const stor = [...new Set(state.base.map(p => p.storage))].sort((a, b) => parseInt(a) - parseInt(b));
    groups = `
      <div class="fgroup"><h4>Brand</h4><div class="chips">${brands.map(b => chip("brand", b, b, f.brand === b)).join("")}</div></div>
      <div class="fgroup"><h4>Storage</h4><div class="chips">${stor.map(s => chip("storage", s, s, f.storage === s)).join("")}</div></div>
      <div class="fgroup"><h4>Price</h4><div class="chips">${priceChips}</div></div>`;
  } else {
    const sizes = [...new Set(state.base.flatMap(sizesOf))];
    groups = `
      <div class="fgroup"><h4>Size</h4>
        <select id="fsize" aria-label="Size"><option value="">All sizes</option>${sizes.map(s => `<option ${f.size === s ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div class="fgroup"><h4>Price</h4><div class="chips">${priceChips}</div></div>`;
  }

  const catChips = mode === "phones" ? "" : `
    <div class="chips scroll" role="tablist">
      ${["all","men","women","bags","shoes"].map(c => `<a class="chip ${cat === c ? "on" : ""}" href="#/shop${c === "all" ? "" : "?cat=" + c}">${CAT_NAMES[c]}</a>`).join("")}
      <a class="chip" href="#/phones">Phones →</a>
    </div>`;

  const title = mode === "phones" ? "Phones" : (cat === "all" ? "Shop the Kloset" : CAT_NAMES[cat]);
  const sub = mode === "phones"
    ? "Brand new, genuine phones in sealed boxes, covered by our shop warranty."
    : "Quality pieces at prices that make sense. New stock every week.";

  return `
  <div class="wrap">
    <div class="shop-head">
      <h1 class="page">${title}</h1>
      <p style="color:var(--muted);font-size:.92rem;margin-top:4px">${sub}</p>
      <label class="search"><span class="sr">Search</span>${ICON.search}
        <input id="fq" type="search" placeholder="${mode === "phones" ? "Search iPhone, Samsung…" : "Search jeans, dress, sneakers…"}" value="${f.q}"></label>
      ${catChips}
    </div>
    <div class="shop-layout">
      <aside class="fpanel" id="fpanel" aria-label="Filters">
        <div class="fpanel-h"><h3>Filters</h3><button class="close-x" data-close-filters aria-label="Close">×</button></div>
        <div class="fpanel-b">${groups}</div>
        <div class="fpanel-f">
          <button class="btn btn-line" data-clear style="flex:1">Clear</button>
          <button class="btn btn-green" data-close-filters style="flex:2" id="showBtn">Show items</button>
        </div>
      </aside>
      <div>
        <div class="toolbar">
          <button class="fbtn" data-open-filters>${ICON.filter} Filters <em id="fcount"></em></button>
          <select id="fsort" aria-label="Sort">
            <option value="new" ${f.sort === "new" ? "selected" : ""}>Newest first</option>
            <option value="low" ${f.sort === "low" ? "selected" : ""}>Price: low to high</option>
            <option value="high" ${f.sort === "high" ? "selected" : ""}>Price: high to low</option>
          </select>
        </div>
        <p class="rcount" id="rcount"></p>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </div>`;
}

function applyFilters(list) {
  const f = state.f, q = f.q.trim().toLowerCase();
  const out = list.filter(p => {
    if (q && !`${p.name} ${p.desc} ${p.brand || ""} ${p.colour || ""}`.toLowerCase().includes(q)) return false;
    if (f.size && !sizesOf(p).includes(f.size)) return false;
    if (f.price) { const [a, b] = f.price.split("-").map(Number); if (p.price < a || (b && p.price > b)) return false; }
    if (f.cond.length && !f.cond.includes(p.condition)) return false;
    if (f.brand && p.brand !== f.brand) return false;
    if (f.storage && p.storage !== f.storage) return false;
    return true;
  });
  const sorts = { new: (a, b) => a.added - b.added, low: (a, b) => a.price - b.price, high: (a, b) => b.price - a.price };
  return out.sort(sorts[f.sort]);
}

function updateResults() {
  const list = applyFilters(state.base);
  const f = state.f;
  const active = (f.size ? 1 : 0) + (f.price ? 1 : 0) + f.cond.length + (f.brand ? 1 : 0) + (f.storage ? 1 : 0);
  $("#grid").innerHTML = list.length ? list.map(card).join("") :
    `<div class="empty"><h3>Nothing matches… yet</h3><p>New stock lands every week. Try fewer filters, or tell us what you're looking for and we'll find it for you.</p>
     <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn btn-line" data-clear>Clear filters</button>
     <a class="btn btn-wa" href="${waLink("Hi Riy@ Kloset! I'm looking for: ")}" target="_blank" rel="noopener">${ICON.wa} Request an item</a></div></div>`;
  $("#rcount").textContent = `${list.length} item${list.length === 1 ? "" : "s"}`;
  $("#fcount").textContent = active || "";
  $("#fcount").style.display = active ? "" : "none";
  $("#showBtn").textContent = `Show ${list.length} item${list.length === 1 ? "" : "s"}`;
}

function toggleFilters(open) {
  $("#fpanel")?.classList.toggle("open", open);
  $("#overlay").classList.toggle("open", open);
}

/* =====================================================================
   SECTION: CART + CHECKOUT VIEW
   Order is sent on WhatsApp. Mobile Money is paid manually after she
   confirms availability (no payment gateway yet).

function cartLines() { return state.cart.map(i => ({ ...i, p: byId(i.id) })).filter(i => i.p); }
function subtotal() { return cartLines().reduce((s, i) => s + i.p.price * i.qty, 0); }
function deliveryOpt() { return CONFIG.delivery.find(d => d.id === state.checkout.delivery) || CONFIG.delivery[0]; }

/* ---------- Pickup booking: day + time slots built from opening hours ---------- */
const SLOT_MINUTES = 30;          // gap between pickup times
const MIN_NOTICE_MINUTES = 60;    // earliest pickup = now + 1 hour (time to pack)
const BOOK_DAYS_AHEAD = 10;       // how far ahead customers can book
function parseHours(str) {        // "9:00am – 7:00pm" → [540, 1140]  (minutes from midnight)
  const m = [...plain(String(str)).matchAll(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)/gi)];
  if (m.length < 2) return null;
  const toMin = x => ((+x[1] % 12) + (x[3].toLowerCase() === "pm" ? 12 : 0)) * 60 + (+x[2] || 0);
  const a = toMin(m[0]), b = toMin(m[1]);
  return b > a ? [a, b] : null;
}
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const fmtTime = min => { const h = Math.floor(min / 60), m = min % 60; return `${h % 12 || 12}:${String(m).padStart(2, "0")}${h < 12 ? "am" : "pm"}`; };
function pickupSlots(date) {
  const range = parseHours((CONFIG.hours[(date.getDay() + 6) % 7] || [])[1]);
  if (!range) return [];
  const now = new Date(), isToday = isoDate(date) === isoDate(now);
  const earliest = isToday ? now.getHours() * 60 + now.getMinutes() + MIN_NOTICE_MINUTES : 0;
  const out = [];
  for (let t = range[0]; t <= range[1] - SLOT_MINUTES; t += SLOT_MINUTES) if (t >= earliest) out.push(t);
  return out;
}
function pickupDays() {
  const days = [], d0 = new Date();
  for (let i = 0; i < BOOK_DAYS_AHEAD; i++) {
    const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + i);
    if (!pickupSlots(d).length) continue;
    const label = d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    days.push({ value: isoDate(d), date: d, label: i === 0 ? `Today, ${label}` : i === 1 ? `Tomorrow, ${label}` : label });
  }
  return days;
}
function pickupBlock(c) {
  const days = pickupDays();
  if (!days.length) return `<p class="hint" style="color:var(--red);font-weight:700;margin-top:8px">No pickup times available right now. Please message us on WhatsApp.</p>`;
  if (!days.some(d => d.value === c.pickupDate)) { c.pickupDate = days[0].value; c.pickupTime = ""; }
  const day = days.find(d => d.value === c.pickupDate);
  const slots = pickupSlots(day.date);
  if (!slots.map(fmtTime).includes(c.pickupTime)) c.pickupTime = "";
  return `
    <div class="hlabel">When will you collect?</div>
    <div class="prow">
      <label class="field"><span>Day</span><select id="pday">${days.map(d => `<option value="${d.value}" ${d.value === c.pickupDate ? "selected" : ""}>${d.label}</option>`).join("")}</select></label>
      <label class="field"><span>Time</span><select id="ptime"><option value="">Choose…</option>${slots.map(t => `<option ${fmtTime(t) === c.pickupTime ? "selected" : ""}>${fmtTime(t)}</option>`).join("")}</select></label>
    </div>
    <span class="hint">We'll have your items packed and ready, no need to call ahead.</span>`;
}
function pickupLabel(c) {
  const d = new Date(c.pickupDate + "T12:00:00");
  return `${d.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" })} at ${c.pickupTime}`;
}
function pickupISO(c) {           // Ghana is on GMT all year, so local shop time = UTC
  const m = c.pickupTime.match(/(\d+):(\d+)(am|pm)/);
  const h = (+m[1] % 12) + (m[3] === "pm" ? 12 : 0);
  return `${c.pickupDate}T${String(h).padStart(2, "0")}:${m[2]}:00Z`;
}

function viewCart() {
  // Drop cart items that have since sold out / been removed
  const before = state.cart.length;
  state.cart = state.cart.filter(i => byId(i.id));
  if (state.cart.length !== before) { saveCart(); setTimeout(() => toast("Some items in your cart have just sold out"), 50); }

  const lines = cartLines();
  if (!lines.length) return `
    <div class="wrap"><div class="empty" style="margin:30px 0">

  const c = state.checkout, d = deliveryOpt(), sub = subtotal(), total = sub + d.fee;

  const items = lines.map((i, idx) => `

        ${i.p.stock > 1
          ? `<div class="qty"><button data-qty="${idx}" data-d="-1" aria-label="Less">−</button><span>${i.qty}</span><button data-qty="${idx}" data-d="1" aria-label="More">+</button></div>`
          : `<div class="one">Last one in stock · order soon</div>`}
      </div>
      <button class="rm" data-remove="${idx}" aria-label="Remove">${ICON.trash}</button>
    </div>`).join("");

  const delOpts = CONFIG.delivery.map(o => `
    <label class="opt ${c.delivery === o.id ? "on" : ""}"><input type="radio" name="del" value="${o.id}" ${c.delivery === o.id ? "checked" : ""}>
      <div><b>${o.label}</b><small>${o.note}</small></div><span class="fee">${o.fee ? cedi(o.fee) : "Free"}</span></label>`).join("");

  // Cash only for in-store pickup. Deliveries must be paid before they're sent out.
  const cashOpt = c.delivery !== "pickup" ? "" : `
    <label class="opt ${c.pay === "cash" ? "on" : ""}"><input type="radio" name="pay" value="cash" ${c.pay === "cash" ? "checked" : ""}>
      <div><b>Cash in store</b><small>Pay when you collect</small></div></label>`;

  const momoNote = c.pay !== "momo" ? "" : `
    <div class="warranty" style="margin-top:12px">${ICON.shield}<div><b>How Mobile Money works</b>
      <p>Send your order first. Once we confirm your items are available, pay
      ${CONFIG.momoNumber ? `to <b>${CONFIG.momoNumber}</b>${CONFIG.momoName ? ` (${CONFIG.momoName})` : ""}` : "to the MoMo number we send you"}.
      ${c.delivery === "pickup" ? "Please only pay after we confirm." : "<b>Payment is required before delivery.</b> We send your order out as soon as it's received."}</p></div></div>`;

  return `
  <div class="wrap">
    <div class="cart-layout">
      <div>
        <h1 class="page" style="margin-bottom:12px">Your cart <span style="color:var(--muted);font-weight:600;font-size:1rem">(${lines.length})</span></h1>
        <div style="display:grid;gap:10px">${items}</div>
        <a href="#/shop" style="display:inline-block;margin-top:14px;font-weight:800;color:var(--green);padding:8px 0">← Keep shopping</a>
      </div>
      <div class="summary">
        <h2>Checkout</h2>
        <p style="color:var(--muted);font-size:.85rem">We'll confirm availability on WhatsApp before you pay.</p>

        <div class="hlabel">Delivery</div>
        ${delOpts}
        ${c.delivery === "pickup" ? pickupBlock(c) : ""}

        <div class="hlabel">Your details</div>
        <label class="field"><span>Name</span><input id="cname" autocomplete="name" placeholder="e.g. Ama Mensah" value="${esc(c.name)}"></label>
        <label class="field"><span>Phone number</span><input id="cphone" type="tel" inputmode="tel" autocomplete="tel" placeholder="024 000 0000" value="${esc(c.phone)}"></label>
        ${c.delivery === "pickup" ? "" : `<label class="field"><span>${c.delivery === "nation" ? "Town & bus station to collect from" : "Area & landmark"}</span><input id="carea" placeholder="${c.delivery === "nation" ? "e.g. Kumasi, VIP station Asafo" : "e.g. East Legon, near A&C Mall"}" value="${esc(c.area)}"></label>`}

        <div class="hlabel">Payment</div>
        <label class="opt ${c.pay === "momo" ? "on" : ""}"><input type="radio" name="pay" value="momo" ${c.pay === "momo" ? "checked" : ""}>
          <div><b>Mobile Money</b><small>MTN MoMo · Telecel Cash</small></div></label>
        ${cashOpt}
        ${momoNote}

        <div class="totals">
          <div><span>Subtotal</span><b>${cedi(sub)}</b></div>
          <div><span>${d.label}</span><b>${d.fee ? cedi(d.fee) : "Free"}</b></div>
          <div class="grand"><span>Total</span><span>${cedi(total)}</span></div>
        </div>
        ${hasBackend() && !session
          ? `<a class="btn btn-green btn-block" href="#/account?next=cart" style="margin-top:16px">${ICON.lock} Sign in to place your order</a>

          : `<a class="btn btn-wa btn-block" data-wa-order href="${waLink("")}" target="_blank" rel="noopener" style="margin-top:16px">${ICON.wa} Send order on WhatsApp</a>`}
        <div class="secure">${ICON.lock} Your details are only used to deliver your order</div>
      </div>
    </div>
  </div>`;
}

/* Saves a copy of the order so it shows in admin → Orders (pickup schedule).
   Fire-and-forget: the WhatsApp message is still the main channel. */
function recordOrder(ref) {
  if (!sb) return;
  const c = state.checkout, d = deliveryOpt();
  const items = cartLines().map(i => ({ id: String(i.p.id), name: plain(i.p.name), size: plain(i.size || i.p.storage || ""), qty: i.qty, price: i.p.price }));
  sb.from("orders").insert({
    ref, user_id: session ? session.user.id : null,
    customer_name: c.name.trim().slice(0, 80), phone: c.phone.trim().slice(0, 20),
    area: c.delivery === "pickup" ? "" : c.area.trim().slice(0, 120),
    delivery: c.delivery, pickup_at: c.delivery === "pickup" ? pickupISO(c) : null,
    items, total: subtotal() + d.fee, payment: c.pay
  }).then(({ error }) => { if (error) console.warn("Order not recorded", error); else myOrders = null; });
  // Remember details on the customer's profile for next time
  if (session && profile) {
    const upd = {};
    if (!profile.full_name && c.name.trim()) upd.full_name = c.name.trim().slice(0, 80);
    if (!profile.phone && c.phone.trim()) upd.phone = c.phone.trim().slice(0, 20);
    if (!profile.area && c.area.trim() && c.delivery !== "pickup") upd.area = c.area.trim().slice(0, 120);
    if (Object.keys(upd).length) sb.from("profiles").update(upd).eq("id", session.user.id).then(() => Object.assign(profile, upd));
  }
}

/* Builds the pre-filled WhatsApp order message */
function checkoutProblem() {
  const c = state.checkout;
  if (!c.name.trim()) return ["Please enter your name", "#cname"];
  if (c.phone.replace(/\D/g, "").length < 9) return ["Please enter a valid phone number", "#cphone"];
  if (c.delivery !== "pickup" && !c.area.trim()) return ["Please enter your area / landmark", "#carea"];
  if (c.delivery === "pickup" && (!c.pickupDate || !c.pickupTime)) return ["Please choose a pickup day and time", "#ptime"];
  return null;
}
function buildOrderMessage(ref) {
  const c = state.checkout, d = deliveryOpt(), sub = subtotal();
  const lines = cartLines().map((i, n) => {
    const detail = i.p.cat === "phones" ? `${i.p.storage}, ${i.p.colour}` : `Size ${i.size}`;
    return `${n + 1}. ${plain(i.p.name)} (${plain(detail)})${i.qty > 1 ? ` x${i.qty}` : ""} – ${cedi(i.p.price * i.qty)}`;
  });
  const pay = c.pay === "cash" ? "Cash in store" : (c.delivery === "pickup" ? "Mobile Money (after confirmation)" : "Mobile Money before delivery");
  return [
    `Hello Riy@ Kloset! 👋 I'd like to order:`, ``,
    ...lines, ``,
    `Subtotal: ${cedi(sub)}`,
    `Delivery: ${plain(d.label)} (${d.fee ? cedi(d.fee) : "Free"})`,
    ...(c.delivery === "pickup" ? [`*Pickup: ${pickupLabel(c)}*`] : []),
    `*TOTAL: ${cedi(sub + d.fee)}*`, ``,
    `Name: ${c.name || "-"}`,
    `Phone: ${c.phone || "-"}`,
    ...(c.delivery === "pickup" ? [] : [`Location: ${c.area || "-"}`]),
    `Payment: ${pay}`,
    `Order ref: ${ref}`, ``,
    `Please confirm availability. Thank you!`
  ].join("\n");
}

let session = null, profile = null, myOrders = null;

async function initAuth() {
  if (!hasBackend()) return;
  const c = window.RK_CONFIG;
  sb = sb || window.supabase.createClient(c.supabaseUrl, c.supabaseAnonKey);
  sb.auth.onAuthStateChange((event, sess) => {
    session = sess;
    updateAccountIcon();
    if (event === "PASSWORD_RECOVERY") { location.hash = "#/account?reset=1"; return; }
    if (event === "SIGNED_OUT") { profile = null; myOrders = null; }
    if (event === "SIGNED_IN") {
      // Don't call Supabase inside this callback (can deadlock); run right after
      setTimeout(async () => {
        await loadProfile();
        if (/access_token=/.test(location.hash)) location.hash = "#/account";   // arrived from email confirmation
      }, 0);
    }
  });
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) await loadProfile();
  updateAccountIcon();
}
async function loadProfile() {
  if (!session) return;
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
  profile = data || { full_name: "", phone: "", area: "" };
  const c = state.checkout;           // pre-fill checkout
  c.name = c.name || profile.full_name || "";
  c.phone = c.phone || profile.phone || "";
  c.area = c.area || profile.area || "";
}
function updateAccountIcon() {
  const b = $("#acctBtn"); if (!b) return;
  if (session) {
    const n = (profile && profile.full_name) || session.user.email || "?";
    b.innerHTML = `<span class="initial">${esc(n.trim()[0].toUpperCase())}</span>`;
  } else {
    b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:24px;height:24px"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>`;
  }
}
function authError(e) {
  const m = (e && e.message) || String(e);
  if (/Invalid login/i.test(m)) return "Wrong email or password.";
  if (/Email not confirmed/i.test(m)) return "Please confirm your email first. Check your inbox (and spam).";
  if (/already registered|already exists/i.test(m)) return "An account with this email already exists. Try signing in.";
  if (/Password should be/i.test(m)) return "Password must be at least 8 characters.";
  if (/rate limit/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
  if (/Failed to fetch|network/i.test(m)) return "No internet connection. Try again.";
  return m;
}

/* Account form handling */
document.addEventListener("submit", async e => {
  const f = e.target, id = f.id;
  if (!["signinForm", "signupForm", "profForm", "emailForm", "pwForm", "resetForm", "deleteForm"].includes(id)) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const btn = f.querySelector("button:not([type=button])"), label = btn.textContent;
  const done = () => { btn.disabled = false; btn.textContent = label; };
  btn.disabled = true; btn.textContent = "Please wait…";
  const goNext = () => { location.hash = f.dataset.next === "cart" ? "#/cart" : "#/account"; };

  if (id === "signinForm") {
    const { error } = await sb.auth.signInWithPassword({ email: d.email.trim(), password: d.password });
    done(); if (error) return toast(authError(error));
    await loadProfile(); updateAccountIcon(); toast("Signed in ✓"); goNext(); render();
  }
  if (id === "signupForm") {
    const { data, error } = await sb.auth.signUp({ email: d.email.trim(), password: d.password,
      options: { data: { full_name: d.full_name.trim(), phone: d.phone.trim() }, emailRedirectTo: location.origin + location.pathname } });
    done(); if (error) return toast(authError(error));
    if (!data.session) {   // email confirmation is switched on in Supabase
      app.innerHTML = `<div class="wrap acct"><div class="empty" style="margin-top:20px"><div style="font-size:2.4rem">📧</div><h3>Check your email</h3>
        <p>We sent a confirmation link to <b>${esc(d.email)}</b>. Tap it, then come back and sign in. Your cart is saved.</p>
        <a class="btn btn-green" href="#/account?mode=signin${f.dataset.next ? "&next=" + f.dataset.next : ""}">Go to sign in</a></div></div>`;
      return;
    }
    session = data.session; await loadProfile(); updateAccountIcon(); toast("Account created ✓"); goNext(); render();
  }
  if (id === "profForm") {
    const upd = { full_name: d.full_name.trim().slice(0, 80), phone: d.phone.trim().slice(0, 20), area: d.area.trim().slice(0, 120) };
    const { error } = await sb.from("profiles").upsert({ id: session.user.id, ...upd });
    done(); if (error) return toast(authError(error));
    profile = { ...profile, ...upd };
    Object.assign(state.checkout, { name: upd.full_name, phone: upd.phone, area: upd.area || state.checkout.area });
    updateAccountIcon(); toast("Details saved ✓");
  }
  if (id === "emailForm") {
    const { error } = await sb.auth.updateUser({ email: d.email.trim() }, { emailRedirectTo: location.origin + location.pathname });
    done(); toast(error ? authError(error) : "Check your new email to confirm the change");
  }
  if (id === "pwForm" || id === "resetForm") {
    const { error } = await sb.auth.updateUser({ password: d.pw });
    done(); if (error) return toast(authError(error));
    toast("Password updated ✓"); f.reset();
    if (id === "resetForm") location.hash = "#/account";
  }
  if (id === "deleteForm") {
    if (d.confirm.trim().toUpperCase() !== "DELETE") { done(); return toast("Type DELETE to confirm"); }
    const { error } = await sb.rpc("delete_my_account");
    if (error) { done(); return toast(authError(error)); }
    await sb.auth.signOut().catch(() => {});
    try { localStorage.removeItem("rk_cart"); } catch (_) {}
    session = null; profile = null; myOrders = null; state.cart = []; saveCart();
    state.checkout = { ...state.checkout, name: "", phone: "", area: "" };
    updateAccountIcon(); location.hash = "#/"; toast("Your account has been deleted");
  }
});
document.addEventListener("click", async e => {

function saveCart() {
  store.set("rk_cart", state.cart);
  const n = state.cart.reduce((s, i) => s + i.qty, 0);
  document.querySelectorAll(".count").forEach(el => { el.textContent = n; el.dataset.n = n; });
}
function addToCart(id, size) {
  const p = byId(id);
  size = size || sizesOf(p)[0] || "";
  const line = state.cart.find(i => i.id === id && i.size === size);
  const already = state.cart.filter(i => i.id === id).reduce((s, i) => s + i.qty, 0);
  if (already >= p.stock) { toast(p.stock === 1 ? "Already in your cart. It's the only one!" : "That's all we have in stock", `<a href="#/cart">View cart</a>`); return false; }
  if (line) line.qty++; else state.cart.push({ id, size, qty: 1 });
  saveCart();
  toast(`Added: ${p.name}`, `<a href="#/cart">View cart →</a>`);
  return true;
}

/* =====================================================================
   SECTION: EVENTS (one delegated listener for everything)
   ===================================================================== */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a, [data-f]");
  if (!t) return;

  // Add from product card
  if (t.dataset.add) {
    if (addToCart(t.dataset.add)) { t.classList.add("in"); t.innerHTML = ICON.check; }
    return;
  }
  // Add from product page
  if (t.dataset.addDetail) {
    const p = byId(t.dataset.addDetail);
    if (inCart(p.id) && sizesOf(p).length <= 1) { location.hash = "#/cart"; return; }
    if (!state.selSize && sizesOf(p).length > 1) { toast("Please choose a size first"); return; }
    if (addToCart(p.id, state.selSize)) t.innerHTML = ICON.check + " In your cart · View cart";
    return;
  }
  // Size chooser
  if (t.dataset.size) {
    state.selSize = t.dataset.size;
    document.querySelectorAll("#sizeChips .chip").forEach(c => c.classList.toggle("on", c === t));
    return;
  }
  // Gallery thumbnails
  if (t.dataset.thumb !== undefined) {
    const p = byId(location.hash.split("/")[2]);
    const g = $("#gmain");
    g.innerHTML = pic(p, +t.dataset.thumb) + badges(p);
    t.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === t));
    return;
  }
  // Filter chips
  if (t.dataset.f) {
    const k = t.dataset.f, v = t.dataset.v, f = state.f;
    if (k === "cond") {
      f.cond = f.cond.includes(v) ? f.cond.filter(x => x !== v) : [...f.cond, v];
      t.classList.toggle("on");
    } else {
      f[k] = f[k] === v ? "" : v;
      t.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === t && f[k] === v));
    }
    updateResults();
    return;
  }
  if (t.hasAttribute("data-open-filters")) { toggleFilters(true); return; }
  if (t.hasAttribute("data-close-filters")) { toggleFilters(false); return; }
  if (t.hasAttribute("data-clear")) {
    const sort = state.f.sort; state.f = freshFilters(); state.f.sort = sort;
    toggleFilters(false); render(); return;
  }
  // Cart quantity / remove
  if (t.dataset.qty !== undefined) {
    const line = state.cart[+t.dataset.qty], p = byId(line.id), next = line.qty + (+t.dataset.d);
    if (next < 1) state.cart.splice(+t.dataset.qty, 1);
    else if (next > p.stock) toast("That's all we have in stock");
    else line.qty = next;
    saveCart(); app.innerHTML = viewCart(); return;
  }
  if (t.dataset.remove !== undefined) { state.cart.splice(+t.dataset.remove, 1); saveCart(); app.innerHTML = viewCart(); return; }
  // WhatsApp order: plain link, message filled in at click time
  if (t.hasAttribute("data-wa-order")) {
    const problem = checkoutProblem();
    if (problem) { e.preventDefault(); toast(problem[0]); $(problem[1])?.focus(); return; }
    const ref = "RK-" + Date.now().toString(36).toUpperCase().slice(-6);
    t.href = waLink(buildOrderMessage(ref));
    recordOrder(ref);
    return;
  }
});

$("#overlay").addEventListener("click", () => toggleFilters(false));

// Text inputs & selects (search, sort, size, checkout fields)
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "fq") { state.f.q = el.value; updateResults(); }
  if (el.id === "cname") state.checkout.name = el.value;
  if (el.id === "carea") state.checkout.area = el.value;
  if (el.id === "cphone") state.checkout.phone = el.value;
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "fsort") { state.f.sort = el.value; updateResults(); }
  if (el.id === "fsize") { state.f.size = el.value; updateResults(); }
  if (el.name === "del") { state.checkout.delivery = el.value; app.innerHTML = viewCart(); }
  if (el.name === "pay") { state.checkout.pay = el.value; app.innerHTML = viewCart(); }
  if (el.id === "pday") { state.checkout.pickupDate = el.value; state.checkout.pickupTime = ""; app.innerHTML = viewCart(); }
  if (el.id === "ptime") state.checkout.pickupTime = el.value;
});

/* =====================================================================
   SECTION: ROUTER (hash-based: #/  #/shop?cat=men  #/phones  #/p/m1  #/cart  #/about)
   ===================================================================== */
function render(keepScroll) {
  if (LOAD_ERROR) {
    app.innerHTML = `<div class="wrap"><div class="empty" style="margin:30px 0"><h3>We couldn't load the shop</h3>
      <p>Please check your internet connection and try again, or message us on WhatsApp.</p>
      <button class="btn btn-green" onclick="location.reload()">Try again</button></div></div>`;
    return;
  }
  const raw = location.hash.slice(1) || "/";
  // Returning from an email link (confirm / reset): Supabase reads the tokens, auth handler then routes
  if (/access_token=|type=recovery/.test(raw)) { app.innerHTML = `<div class="loading"><div class="spinner"></div></div>`; return; }
  if (/^error/.test(raw)) {
    const msg = new URLSearchParams(raw).get("error_description");
    history.replaceState(null, "", location.pathname + "#/account");
    toast(msg ? msg.replace(/\+/g, " ") : "That link has expired. Please try again.");
    return render();
  }
  const [path, qs] = raw.split("?");
  const parts = path.split("/").filter(Boolean);
  const q = new URLSearchParams(qs || "");
  let nav = "home";

  switch (parts[0]) {
    case "shop":   nav = "shop";   app.innerHTML = viewShop("fashion", q.get("cat") || "all", q.get("sort")); updateResults(); break;
    case "phones": nav = "phones"; app.innerHTML = viewShop("phones", "phones"); updateResults(); break;
    case "p":      { const p = byId(parts[1]); nav = p && p.cat === "phones" ? "phones" : "shop"; app.innerHTML = viewProduct(parts[1]); break; }
    case "cart":   nav = "cart";   app.innerHTML = viewCart(); break;
    case "about":  nav = "about";  app.innerHTML = viewAbout(); break;
    case "account": nav = "account"; app.innerHTML = viewAccount(q); break;
    case "privacy": nav = "about"; app.innerHTML = viewPrivacy(); break;
    default:       app.innerHTML = viewHome();
  }
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === nav));
  toggleFilters(false);
  if (!keepScroll) window.scrollTo(0, 0);
}

/* ---------- Init ---------- */
function applyConfig() {
  document.querySelectorAll(".wa-link").forEach(a => a.href = waLink("Hi Riy@ Kloset! 👋 I have a question."));
  $("#ig").href = plain(CONFIG.instagram);
  $("#tt").href = plain(CONFIG.tiktok);
  document.querySelectorAll("[data-city]").forEach(el => el.innerHTML = CONFIG.city);
  $("#yr").textContent = new Date().getFullYear();
  const fp = $("#footPhone");
  if (fp) { fp.innerHTML = phoneList().length ? "📞 " + phoneLinks("inherit", " · ") : ""; fp.style.display = phoneList().length ? "" : "none"; }
  if (DEMO && !$(".demo-bar")) app.insertAdjacentHTML("beforebegin", `<div class="demo-bar">Demo mode: showing sample stock. Add your Supabase keys to config.js to go live.</div>`);
}
window.addEventListener("hashchange", () => render());

(async function init() {
  // 1) Show cached stock instantly on repeat visits (fast on mobile data)
  const cached = hasBackend() ? store.get("rk_cache", null) : null;
  if (cached && Array.isArray(cached.p)) {
    PRODUCTS = cached.p.map(fromRow);
    if (cached.s) CONFIG = { ...CONFIG, ...cleanSettings(cached.s) };
    applyConfig(); saveCart(); render();
  } else {
    app.innerHTML = `<div class="loading"><div class="spinner"></div><p style="margin-top:12px">Opening the Kloset…</p></div>`;
  }
  // 2) Load fresh stock + settings, then re-render
  await Promise.all([loadData(), initAuth()]);
  applyConfig(); saveCart(); updateAccountIcon();
  render(!!cached);
})();
</script>
